name: Deploy to FastComet

# Fires on every push to main (triggered by sync.sh)
on:
  push:
    branches:
      - main

jobs:
  # ── Furlio — Pet Store ──────────────────────────────────────────────────────
  deploy-pet-store:
    name: Deploy Furlio (Pet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy — wp-content
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.PET_FTP_SERVER }}
          username:  ${{ secrets.PET_FTP_USERNAME }}
          password:  ${{ secrets.PET_FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/pet/wp-content/
          # PET_FTP_REMOTE_DIR = the wp-content folder on FastComet for furlio.au
          # e.g.  /public_html/wp-content/         (main domain)
          #       /public_html/furlio.au/wp-content/ (addon domain)
          server-dir: ${{ secrets.PET_FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/cache/**
            **/upgrade/**
            **/uploads/**
            **/ai-content/**
            **/*.log

  # ── LetsDrive — Auto Store ──────────────────────────────────────────────────
  deploy-auto-store:
    name: Deploy LetsDrive (Auto)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy — wp-content
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.AUTO_FTP_SERVER }}
          username:  ${{ secrets.AUTO_FTP_USERNAME }}
          password:  ${{ secrets.AUTO_FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/auto/wp-content/
          # AUTO_FTP_REMOTE_DIR = the wp-content folder on FastComet for letsdrive.au
          server-dir: ${{ secrets.AUTO_FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/cache/**
            **/upgrade/**
            **/uploads/**
            **/ai-content/**
            **/*.log
