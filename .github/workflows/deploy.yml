name: Deploy to FastComet

# Triggers:
#   1. Auto: every push to main that changes store files
#   2. Manual: GitHub UI → Actions → "Deploy to FastComet" → Run workflow
on:
  push:
    branches: [main]
    paths:
      - 'niches/**'
      - '_common/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      store:
        description: 'Store to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pet
          - auto
      include_db:
        description: 'Import database? WARNING — overwrites live DB. Only use for first deploy.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      fix_urls:
        description: 'Run URL search-replace only (no DB import). Fixes /pet/ and /auto/ widget links on live server.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (set at: repo → Settings → Secrets → Actions):
#
#   FTP_SERVER              FastComet FTP hostname (e.g. server123.fastcomet.net)
#   FTP_USERNAME            cPanel/FTP username    (e.g. tripxen1)
#   FTP_PASSWORD            cPanel/FTP password
#
#   PET_FTP_REMOTE_DIR      Remote path to pet wp-content (FTP-root-relative)
#                           e.g.  /dropshipping/public_html/pet-store/wp-content/
#   AUTO_FTP_REMOTE_DIR     Same for auto store
#
#   PET_FTP_SQL_DIR         Remote path to pet store ROOT (for .htaccess + SQL upload)
#                           e.g.  /dropshipping/public_html/pet-store/
#   AUTO_FTP_SQL_DIR        Same for auto store
#
#   FASTCOMET_SSH_HOST      SSH hostname (same server as FTP)
#   FASTCOMET_SSH_USER      SSH username (same as FTP username)
#   FASTCOMET_SSH_KEY       SSH private key content (base64-encoded)
#   FASTCOMET_SSH_PORT      SSH port — try 22 first, fall back to 21098
#
#   PET_STORE_PATH          Absolute path on server: /home/tripxen1/dropshipping/public_html/pet-store
#   AUTO_STORE_PATH         Absolute path on server: /home/tripxen1/dropshipping/public_html/auto-store
#
#   PET_DB_NAME             tripxen1_ecom_petdb
#   PET_DB_USER             tripxen1_furlio
#   PET_DB_PASS             DB password for pet store
#   AUTO_DB_NAME            tripxen1_ecom_autodb
#   AUTO_DB_USER            tripxen1_letsdrive
#   AUTO_DB_PASS            DB password for auto store
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Furlio — Pet Store ──────────────────────────────────────────────────────
  deploy-pet:
    name: Deploy Furlio (pet)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.store == 'all' || github.event.inputs.store == 'pet'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP — wp-content (themes, plugins, mu-plugins)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/pet/wp-content/
          server-dir: ${{ secrets.PET_FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/cache/**
            **/upgrade/**
            **/uploads/**
            **/ai-content/**
            **/ai1wm-backups/**
            **/*.log
            **/wp-cache-config.php
            **/advanced-cache.php

      - name: FTP — Root files (.htaccess)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/pet/
          server-dir: ${{ secrets.PET_FTP_SQL_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-content/**
            **/*.sql
            **/*.php

      - name: FTP — SQL dump (only when include_db=true)
        if: github.event.inputs.include_db == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/pet/
          server-dir: ${{ secrets.PET_FTP_SQL_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/wp-content/**

      - name: SSH — Import DB + fix URLs + flush (only when include_db=true)
        if: github.event.inputs.include_db == 'true'
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_KEY:  ${{ secrets.FASTCOMET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "set -e
               cd '${{ secrets.PET_STORE_PATH }}'
               echo '=== Importing pet DB ==='
               mysql -u'${{ secrets.PET_DB_USER }}' -p'${{ secrets.PET_DB_PASS }}' '${{ secrets.PET_DB_NAME }}' < pet-store.sql
               echo '=== Fixing absolute URLs (handles serialised data) ==='
               command -v wp >/dev/null && wp search-replace 'http://localhost/pet' 'https://furlio.au' --all-tables --quiet --allow-root || true
               echo '=== Fixing relative /pet/ paths in widget/menu content ==='
               command -v wp >/dev/null && wp search-replace '/pet/' '/' --all-tables --skip-columns=guid --quiet --allow-root || true
               echo '=== Regenerating rewrite rules + flushing cache ==='
               command -v wp >/dev/null && wp rewrite flush --hard --allow-root 2>/dev/null || true
               command -v wp >/dev/null && wp cache flush --allow-root 2>/dev/null || true
               echo '=== Pet DB import complete ==='"

      - name: SSH — Fix URLs only (when fix_urls=true, no DB import)
        if: github.event.inputs.fix_urls == 'true'
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_KEY:  ${{ secrets.FASTCOMET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "cd '${{ secrets.PET_STORE_PATH }}'
               echo '=== Fixing absolute URLs ==='
               command -v wp >/dev/null && wp search-replace 'http://localhost/pet' 'https://furlio.au' --all-tables --quiet --allow-root || true
               echo '=== Fixing relative /pet/ paths ==='
               command -v wp >/dev/null && wp search-replace '/pet/' '/' --all-tables --skip-columns=guid --quiet --allow-root || true
               command -v wp >/dev/null && wp rewrite flush --hard --allow-root 2>/dev/null || true
               command -v wp >/dev/null && wp cache flush --allow-root 2>/dev/null || true
               echo '=== Pet: URL fix complete ==='"

      - name: SSH — Flush rewrites + cache
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_KEY:  ${{ secrets.FASTCOMET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "cd '${{ secrets.PET_STORE_PATH }}' &&
               command -v wp >/dev/null && wp rewrite flush --hard --allow-root 2>/dev/null || true &&
               command -v wp >/dev/null && wp cache flush --allow-root 2>/dev/null || true &&
               echo '=== Pet: rewrite+cache flushed ==='"

  # ── LetsDrive — Auto Store ──────────────────────────────────────────────────
  deploy-auto:
    name: Deploy LetsDrive (auto)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.store == 'all' || github.event.inputs.store == 'auto'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP — wp-content (themes, plugins, mu-plugins)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/auto/wp-content/
          server-dir: ${{ secrets.AUTO_FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/cache/**
            **/upgrade/**
            **/uploads/**
            **/ai-content/**
            **/ai1wm-backups/**
            **/*.log
            **/wp-cache-config.php
            **/advanced-cache.php

      - name: FTP — Root files (.htaccess)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/auto/
          server-dir: ${{ secrets.AUTO_FTP_SQL_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-content/**
            **/*.sql
            **/*.php

      - name: FTP — SQL dump (only when include_db=true)
        if: github.event.inputs.include_db == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          port:      21
          local-dir: ./niches/auto/
          server-dir: ${{ secrets.AUTO_FTP_SQL_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/wp-content/**

      - name: SSH — Import DB + fix URLs + flush (only when include_db=true)
        if: github.event.inputs.include_db == 'true'
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_KEY:  ${{ secrets.FASTCOMET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "set -e
               cd '${{ secrets.AUTO_STORE_PATH }}'
               echo '=== Importing auto DB ==='
               mysql -u'${{ secrets.AUTO_DB_USER }}' -p'${{ secrets.AUTO_DB_PASS }}' '${{ secrets.AUTO_DB_NAME }}' < auto-store.sql
               echo '=== Fixing absolute URLs (handles serialised data) ==='
               command -v wp >/dev/null && wp search-replace 'http://localhost/auto' 'https://letsdrive.au' --all-tables --quiet --allow-root || true
               echo '=== Fixing relative /auto/ paths in widget/menu content ==='
               command -v wp >/dev/null && wp search-replace '/auto/' '/' --all-tables --skip-columns=guid --quiet --allow-root || true
               echo '=== Regenerating rewrite rules + flushing cache ==='
               command -v wp >/dev/null && wp rewrite flush --hard --allow-root 2>/dev/null || true
               command -v wp >/dev/null && wp cache flush --allow-root 2>/dev/null || true
               echo '=== Auto DB import complete ==='"

      - name: SSH — Fix URLs only (when fix_urls=true, no DB import)
        if: github.event.inputs.fix_urls == 'true'
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_KEY:  ${{ secrets.FASTCOMET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "cd '${{ secrets.AUTO_STORE_PATH }}'
               echo '=== Fixing absolute URLs ==='
               command -v wp >/dev/null && wp search-replace 'http://localhost/auto' 'https://letsdrive.au' --all-tables --quiet --allow-root || true
               echo '=== Fixing relative /auto/ paths ==='
               command -v wp >/dev/null && wp search-replace '/auto/' '/' --all-tables --skip-columns=guid --quiet --allow-root || true
               command -v wp >/dev/null && wp rewrite flush --hard --allow-root 2>/dev/null || true
               command -v wp >/dev/null && wp cache flush --allow-root 2>/dev/null || true
               echo '=== Auto: URL fix complete ==='"

      - name: SSH — Flush rewrites + cache
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_KEY:  ${{ secrets.FASTCOMET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "cd '${{ secrets.AUTO_STORE_PATH }}' &&
               command -v wp >/dev/null && wp rewrite flush --hard --allow-root 2>/dev/null || true &&
               command -v wp >/dev/null && wp cache flush --allow-root 2>/dev/null || true &&
               echo '=== Auto: rewrite+cache flushed ==='"
